<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Práctica Git</title>
    <link rel='stylesheet' href='./css/form.css'>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="nav-link active" data-tab="inicio">Inicio</a>
        <a href="#" class="nav-link" data-tab="proyectos">Proyectos</a>
        <a href="#" class="nav-link" data-tab="contacto">Contacto</a>
    </nav>

    <div id="inicio" class="tab-content">Contenido de Inicio</div>
    <div id="proyectos" class="tab-content" style="display:none;">Contenido de Proyectos</div>
    <div id="contacto" class="tab-content" style="display:none;">Contenido de Contacto</div>

    <!-- Botón de nombres -->
    <button id="boton-nombres">Leo</button>

    <!-- Formulario absurdo -->
    <form id="formAbsurdo">
        <label>¿Por qué la palabra "separado" se escribe todo junto y "todo junto" se escribe separado?: 
            <input type="text" name="palabra">
        </label><br>

        <label>¿Hasta dónde se lavan la cara los calvos?: 
            <input type="text" name="calvos">
        </label><br>

        <label>¿Por qué no hay comida para gatos con sabor a ratón?: 
            <input type="text" name="gatos">
        </label><br>

        <label>Si estás en el baño de un lugar público y te das cuenta de que no hay papel, ¿cuál es tu plan de emergencia real?: 
            <input type="text" name="baño">
        </label><br>

        <label>¿Crees en los extraterrestres?
            <select name="alien">
                <option value="">-- Selecciona --</option>
                <option value="Sí">Sí</option>
                <option value="No">No</option>
                <option value="Tal vez">Tal vez</option>
            </select>
        </label><br>

        <button type="submit">Enviar</button>
    </form>

    <div id="resultado"></div>

    <script src="./js/form.js"></script>
</body>
</html>
